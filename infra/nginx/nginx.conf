worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/geo+json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

    # Upstreams
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream tiler_backend {
        server tiler:8080;
        keepalive 16;
    }

    upstream app_ui_backend {
        server app_ui:3000;
        keepalive 8;
    }

    upstream admin_ui_backend {
        server admin_ui:3000;
        keepalive 8;
    }

    upstream vision_backend {
        server vision:8090;
        keepalive 8;
    }

    # ==========================================================================
    # HTTP Server (porta 80)
    # ==========================================================================
    server {
        listen 80;
        server_name _;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ======================================================================
        # API Backend (/api)
        # ======================================================================
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ======================================================================
        # Tiler - Tiles GeoTIFF (/tiles)
        # ======================================================================
        location /tiles/ {
            limit_req zone=general_limit burst=100 nodelay;

            rewrite ^/tiles/(.*) /$1 break;
            proxy_pass http://tiler_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Cache tiles
            proxy_cache_valid 200 1h;
        }

        # ======================================================================
        # Vision Service (/vision)
        # ======================================================================
        location /vision/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/vision/(.*) /$1 break;
            proxy_pass http://vision_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ======================================================================
        # Admin UI (/admin)
        # ======================================================================
        location /admin {
            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://admin_ui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ======================================================================
        # App UI (/app)
        # ======================================================================
        location /app {
            limit_req zone=general_limit burst=30 nodelay;

            proxy_pass http://app_ui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ======================================================================
        # Next.js Static Assets
        # ======================================================================
        location /_next/static/ {
            proxy_pass http://app_ui_backend;
            proxy_http_version 1.1;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ======================================================================
        # Root redirect
        # ======================================================================
        location = / {
            return 302 /app;
        }

        location = /favicon.ico {
            proxy_pass http://app_ui_backend/favicon.ico;
            access_log off;
            log_not_found off;
        }

        # Block sensitive paths
        location ~ /\. {
            deny all;
        }
    }

    # ==========================================================================
    # HTTPS Server (descomente após configurar SSL)
    # ==========================================================================
    # server {
    #     listen 443 ssl http2;
    #     server_name seu-dominio.com.br;
    #
    #     ssl_certificate /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_tickets off;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # Copie todos os location blocks do server HTTP acima
    # }
}
