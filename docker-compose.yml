name: vivacampo

services:
  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vivacampo-net
    restart: unless-stopped

  # ============================================================================
  # API - FastAPI Backend
  # ============================================================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: vivacampo/api:${TAG:-latest}
    env_file:
      - ./infra/docker/env/.env.local
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
      - TILER_BASE_URL=http://tiler:8080
      - VISION_SERVICE_URL=http://vision:8090
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vivacampo-net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # WORKER - Background Jobs
  # ============================================================================
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    image: vivacampo/worker:${TAG:-latest}
    env_file:
      - ./infra/docker/env/.env.local
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379
      - TILER_BASE_URL=http://tiler:8080
      - VISION_SERVICE_URL=http://vision:8090
      - GDAL_HTTP_MAX_RETRY=5
      - GDAL_HTTP_RETRY_DELAY=1
      - GDAL_HTTP_RETRY_CODES=409,429,500,502,503,504
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vivacampo-net
    command: ["python", "-m", "worker.main"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ============================================================================
  # TILER - GeoTIFF Tile Server
  # ============================================================================
  tiler:
    build:
      context: ./services/tiler
      dockerfile: Dockerfile
    image: vivacampo/tiler:${TAG:-latest}
    env_file:
      - ./infra/docker/env/.env.local
    networks:
      - vivacampo-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["uvicorn", "tiler.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "2"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # ADMIN UI - Next.js
  # ============================================================================
  admin_ui:
    build:
      context: ./services/admin-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
        NEXT_PUBLIC_BASE_PATH: /admin
    image: vivacampo/admin-ui:${TAG:-latest}
    environment:
      - NODE_ENV=production
    networks:
      - vivacampo-net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================================
  # APP UI - Next.js
  # ============================================================================
  app_ui:
    build:
      context: ./services/app-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
        NEXT_PUBLIC_BASE_PATH: /app
        NEXT_PUBLIC_ENABLE_MOCK_AUTH: ${NEXT_PUBLIC_ENABLE_MOCK_AUTH:-false}
    image: vivacampo/app-ui:${TAG:-latest}
    environment:
      - NODE_ENV=production
    networks:
      - vivacampo-net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/app"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================================
  # VISION - TensorFlow ML Service
  # ============================================================================
  vision:
    build:
      context: ./services/vision-service
      dockerfile: Dockerfile
    image: vivacampo/vision:${TAG:-latest}
    env_file:
      - ./infra/docker/env/.env.local
    environment:
      - PYTHONPATH=/app
      - MODEL_CACHE_DIR=/app/models/cache
      - TFLITE_DIR=/app/models/tflite
      - ENABLE_GPU=false
    volumes:
      - vision_models:/app/models/cache
      - vision_tflite:/app/models/tflite
    networks:
      - vivacampo-net
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8090", "--workers", "2"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ============================================================================
  # NGINX - Reverse Proxy (produção)
  # ============================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - api
      - tiler
      - admin_ui
      - app_ui
    networks:
      - vivacampo-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  vivacampo-net:
    driver: bridge

volumes:
  redisdata:
  vision_models:
  vision_tflite:
  certbot_webroot:
